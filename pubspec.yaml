name: office_time_tracker
description: "Office Break time tracker application"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  objectbox: ^5.2.0
  google_sign_in: ^7.1.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  workmanager: ^0.9.0+3
  flutter_riverpod: ^3.3.1
  cloud_firestore: ^6.1.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  # alice: ^1.0.0
  home_widget: ^0.9.0
  sign_in_with_apple: ^7.0.1
  objectbox_flutter_libs: ^5.2.0
  pretty_logger: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename:
  build_runner: ^2.12.2
  flutter_gen_runner:
  objectbox_generator: ^5.2.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package



# dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  background_image: "assets/bg.png"
  image: "assets/logo.png"
  branding: "assets/brand.png"
  android_12:
    color: "#B8AEAF"
    image: "assets/logo.png"
    branding: "assets/brand.png"

# dart run package_rename
package_rename_config:
  android:
    app_name: office_time_tracker
    package_name: com.example.office_time_tracker
    override_old_package: # No needed
    lang:
      # (Optional) (String) The android development language {kotlin(default) or java}

  ios:
    app_name: office_time_tracker
    package_name: com.example.office_time_tracker
    # bundle_name: com.example.office_time_tracker

# command for generate asset fine:: dart run build_runner build
flutter_gen:
  output: lib/constants/

# dart run icons_launcher:create
icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
